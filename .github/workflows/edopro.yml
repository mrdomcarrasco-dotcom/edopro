name: Build EDOPro Genesys
# Progression Series fork: EDOPro 41.0.2 + Genesys points in the deck editor.
# Builds only the Windows (x86, like the official client) and macOS (universal) binaries and uploads them as artifacts.
on: [push, workflow_dispatch]
env:
  # dependency caches as of the 41.0.2 release (April 2025)
  DEPENDENCIES_BASE_URL: https://github.com/edo9300/edopro-vcpkg-cache/releases/download/20250329
  DEPLOY_DIR: deploy
jobs:
  Windows:
    runs-on: windows-2022
    env:
      TRAVIS_OS_NAME: windows
      DXSDK_DIR: /c/d3d9sdk/
      VCPKG_ROOT: /c/vcpkg2
      VS_GEN: vs2022
      BUILD_CONFIG: release
      ARCH: x86
    steps:
    - name: Set custom env vars
      shell: bash
      run: |
        echo "VCPKG_CACHE_ZIP_URL=$DEPENDENCIES_BASE_URL/installed_x86-windows-static-vs2022.zip" >> $GITHUB_ENV
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Install premake
      shell: bash
      run: ./travis/install-premake5.sh
    - name: Install dependencies
      shell: bash
      run: ./travis/dependencies.sh
    - name: Build
      shell: bash
      run: ./travis/build.sh
    - uses: actions/upload-artifact@v4
      with:
        name: windows-x86
        path: |
          bin/release/ygoprodll.exe
          bin/release/ygoprodll.pdb

  Mac-os-cctools:
    strategy:
      fail-fast: false
      matrix:
        include:
          - deploy_name: osx-cctools
            package_name: installed_x64-osx-cctools.7z
            clang: x86_64-macosx
            compiler_arch: x86_64
            premake_arch: x64
          - deploy_name: osx-aarch64-cctools
            package_name: installed_aarch64-osx-cctools.7z
            clang: arm64-macosx
            compiler_arch: arm
            premake_arch: arm64
    runs-on: ubuntu-22.04
    env:
      TRAVIS_OS_NAME: linux
      VCPKG_ROOT: ./vcpkg2
      BUILD_CONFIG: release
      TARGET_OS: macosx
      ARCH: ${{ matrix.premake_arch }}
      CC: ${{ format('/opt/cctools/bin/{0}-clang', matrix.clang) }}
      CXX: ${{ format('/opt/cctools/bin/{0}-clang++', matrix.clang) }}
      AR: ${{ format('/opt/cctools/bin/{0}-apple-darwin11-ar', matrix.compiler_arch) }}
      LDFLAGS: /opt/cctools/darwin/libclang_rt.osx.a
    steps:
    - name: Set custom env vars
      shell: bash
      run: |
        echo "VCPKG_CACHE_7Z_URL=$DEPENDENCIES_BASE_URL/${{ matrix.package_name }}" >> $GITHUB_ENV
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Download cctools
      run: |
        cd /opt
        wget https://github.com/edo9300/cctools-build/releases/download/preview/cctools.tar.xz
        tar xf cctools.tar.xz
        cd cctools/bin
        ln x86_64-apple-darwin11-lipo -s lipo
        ln llvm-install-name-tool -s install_name_tool
    - name: Install premake
      shell: bash
      run: ./travis/install-premake5.sh
    - name: Install dependencies
      shell: bash
      run: ./travis/dependencies.sh
    - name: Build
      shell: bash
      run: ./travis/build.sh
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.deploy_name }}
        path: ${{ format('bin/{0}/release/ygoprodll.app', matrix.premake_arch) }}

  Mac-os-universal:
    runs-on: ubuntu-latest
    needs: [ Mac-os-cctools ]
    steps:
    - name: Download lipo binary
      run: |
        wget https://github.com/edo9300/cctools-build/releases/download/preview/lipo
        chmod +x lipo
    - name: Download osx artifacts
      uses: actions/download-artifact@v4
    - name: Merge binaries
      shell: bash
      run: |
        mkdir -p out
        ./lipo -create -output out/EDOPro ./osx-aarch64-cctools/ygoprodll.app ./osx-cctools/ygoprodll.app
        chmod +x out/EDOPro
    - uses: actions/upload-artifact@v4
      with:
        name: macos-universal
        path: out/EDOPro
